<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Drop | Luxury Hydration</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #0b4f6c;
      --secondary: #01baef;
      --accent: #e8f6ff;
      --text-dark: #1a1a1a;
      --text-light: #ffffff;
      --transition: all 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #fff;
      color: var(--text-dark);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* --- Navigation --- */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 20px 10%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      transition: var(--transition);
    }

    nav.scrolled {
      background: rgba(255, 255, 255, 0.95);
      padding: 15px 10%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 30px;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--primary);
      font-weight: 500;
      font-size: 0.9rem;
      transition: var(--transition);
    }

    .nav-links a:hover {
      color: var(--secondary);
    }

    /* --- Hero Section --- */
    header {
      height: 100vh;
      background: linear-gradient(135deg, #f0f9ff 0%, #ffffff 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
      position: relative;
    }

    /* Abstract background shapes */
    header::before {
        content: '';
        position: absolute;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
        top: -100px;
        right: -100px;
        z-index: 0;
    }

    .hero-content {
        position: relative;
        z-index: 1;
    }

    header h1 {
      font-size: clamp(3rem, 8vw, 5rem);
      font-weight: 700;
      color: var(--primary);
      line-height: 1.1;
      margin-bottom: 20px;
    }

    header p {
      font-size: 1.2rem;
      color: #555;
      max-width: 600px;
      margin-bottom: 30px;
    }

    /* --- Buttons --- */
    .btn {
      display: inline-block;
      padding: 14px 35px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
